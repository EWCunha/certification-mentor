[project]
name = "certification-mentor"
version = "0.1.0"
description = "AI exam preparation tool to help you study for the Anthropic CCAR-F certification"
readme = "README.md"
authors = [{ name = "Eduardo W. da Cunha" }]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "openai>=3.37.0",
    "python-dotenv>=1.2.4",
    "sqlitesearch>=0.3.0",
    "toyaikit>=0.0.11",
]

[project.scripts]
certification-mentor = "certification_mentor:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
